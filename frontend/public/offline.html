<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Pocket Soil Lab AI</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8f5f0;
        color: #2e1d10;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        color: #2d4d24;
        font-size: 1.25rem;
      }
      p {
        color: #5c3a1e;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Pocket Soil Lab AI needs a connection to reach the backend for live weather, soil
        processing and crop recommendations. Reconnect and reload to continue — any
        previously-viewed weather forecast is still available from its own cached view.
      </p>
    </div>
  </body>
</html>
